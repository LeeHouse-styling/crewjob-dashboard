<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>승무원 공고 승인 대시보드</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-dim: #dbeafe;
    --danger: #dc2626;
    --danger-dim: #fee2e2;
    --success: #16a34a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }
  header .sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .refresh-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh-btn:hover { opacity: 0.9; }
  .ghost-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .ghost-btn:hover { background: #fafbfc; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }
  .empty-state small { display: block; margin-top: 10px; line-height: 1.6; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .card-header {
    padding: 16px 18px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .card-header:hover { background: #fafbfc; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .card-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
  }
  .chev { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .card-body {
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .card-body.open { display: block; padding-top: 16px; }
  .reuse-notice {
    background: #ecfdf5;
    color: #059669;
    border: 1px solid #a7f3d0;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13.5px;
    font-family: inherit;
    background: #fdfdfd;
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; margin-top: 6px; line-height: 1.5; color: var(--text-dim); }
  .hint.warn { color: #b45309; }
  .radio-row { display: flex; gap: 10px; }
  .radio-opt {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    font-size: 13px;
    cursor: pointer;
    background: #fdfdfd;
  }
  .radio-opt input { width: auto; margin: 0; }
  .radio-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-dim); font-weight: 600; }
  .link-btn {
    display: inline-block;
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .btn {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-approve { background: var(--success); color: white; }
  .btn-approve:hover { opacity: 0.9; }
  .btn-reject { background: var(--danger-dim); color: var(--danger); }
  .btn-reject:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1d23;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    max-width: 90vw;
    text-align: center;
    line-height: 1.5;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 60px; color: var(--text-dim); font-size: 14px; }

  /* --- 로그인 --- */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-overlay.show { display: flex; }
  .login-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 26px;
    width: 100%;
    max-width: 360px;
  }
  .login-box h2 { font-size: 17px; margin: 0 0 4px; }
  .login-sub { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; line-height: 1.5; }
  .login-box .btn { width: 100%; flex: none; }
  .login-err {
    display: none;
    margin-top: 14px;
    background: var(--danger-dim);
    color: var(--danger);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .login-err.show { display: block; }
</style>
</head>
<body>

<header>
  <div>
    <h1>✈️ 승무원 공고 승인 대시보드</h1>
    <div class="sub" id="countLabel">불러오는 중...</div>
  </div>
  <div class="header-actions">
    <button class="ghost-btn" id="logoutBtn" onclick="logout()" style="display:none">로그아웃</button>
    <button class="refresh-btn" onclick="loadJobs()">새로고침</button>
  </div>
</header>

<main id="main">
  <div class="loading">공고 목록을 불러오는 중...</div>
</main>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>관리자 로그인</h2>
    <p class="login-sub">공고를 승인하려면 로그인이 필요합니다.</p>
    <div class="field">
      <label for="loginEmail">이메일</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPw">비밀번호</label>
      <input type="password" id="loginPw" autocomplete="current-password">
    </div>
    <button class="btn btn-approve" onclick="login()">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://fwpqvveltvqvrjamcubg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3cHF2dmVsdHZxdnJqYW1jdWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMzU3NzMsImV4cCI6MjA5MjcxMTc3M30.Hwr60_yuDfmP3okn_GKOrCP7jsbgktMOIwgol-mFAtI";

let jobsCache = [];
let airlineTemplates = {};  // 항공사명 -> 기존 airline_jobs 행 (자격조건/절차 등 재사용용)
let allAirlineRows = [];    // airline_jobs 전체 행 (반영 대상 드롭다운용)

/* ===================== 세션 관리 ===================== */

let session = null;
try { session = JSON.parse(localStorage.getItem("sb_session") || "null"); } catch (e) { session = null; }

function saveSession(s) {
  session = s;
  if (s) localStorage.setItem("sb_session", JSON.stringify(s));
  else localStorage.removeItem("sb_session");
  document.getElementById("logoutBtn").style.display = s ? "block" : "none";
}

function normalizeSession(data) {
  return {
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600)
  };
}

// 유효한 access_token을 반환. 만료가 가까우면 자동 갱신.
async function ensureToken() {
  if (!session || !session.access_token) return null;

  const now = Math.floor(Date.now() / 1000);
  if (session.expires_at - now > 60) return session.access_token;

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    if (!res.ok) throw new Error(await res.text());
    saveSession(normalizeSession(await res.json()));
    return session.access_token;
  } catch (err) {
    console.error("토큰 갱신 실패", err);
    saveSession(null);
    showLogin("로그인 유효기간이 지났습니다. 다시 로그인하세요.");
    return null;
  }
}

function authHeaders(token) {
  return {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${token || SUPABASE_KEY}`,
    "Content-Type": "application/json"
  };
}

/* ===================== 요청 래퍼 ===================== */
// 모든 Supabase 호출은 여기를 거칩니다.
// 실패 시 응답 본문을 콘솔에 그대로 남기고, 사람이 읽을 수 있는 메시지로 바꿔서 던집니다.
async function sb(path, opts = {}) {
  const token = await ensureToken();
  const res = await fetch(`${SUPABASE_URL}${path}`, {
    ...opts,
    headers: { ...authHeaders(token), ...(opts.headers || {}) }
  });

  if (!res.ok) {
    const raw = await res.text();
    console.error(`[${res.status}] ${opts.method || "GET"} ${path}\n${raw}`);
    throw new Error(describeError(res.status, raw));
  }
  return res;
}

function describeError(status, raw) {
  let detail = raw;
  try {
    const j = JSON.parse(raw);
    detail = j.message || j.msg || j.error_description || j.hint || raw;
  } catch (e) { /* 본문이 JSON이 아니면 원문 그대로 */ }

  if (/invalid api key/i.test(raw)) {
    return "API 키가 거부됐습니다. Supabase 대시보드에서 레거시 키가 비활성화됐는지 확인하고, 새 publishable 키로 교체하세요.";
  }
  if (/row-level security|42501/i.test(raw)) {
    return "RLS 정책에 막혔습니다. 이 계정에 쓰기 권한 정책이 걸려 있는지 확인하세요.";
  }
  if (status === 401 || status === 403) {
    return "인증이 만료됐습니다. 다시 로그인하세요.";
  }
  return `${status} — ${detail}`;
}

/* ===================== 로그인 ===================== */

function showLogin(message) {
  document.getElementById("loginOverlay").classList.add("show");
  const err = document.getElementById("loginErr");
  if (message) {
    err.textContent = message;
    err.classList.add("show");
  } else {
    err.classList.remove("show");
  }
}

function hideLogin() {
  document.getElementById("loginOverlay").classList.remove("show");
}

async function login() {
  const email = val("loginEmail");
  const password = document.getElementById("loginPw").value;
  if (!email || !password) return showLogin("이메일과 비밀번호를 모두 입력하세요.");

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      console.error("로그인 실패", data);
      return showLogin(data.error_description || data.msg || data.message || "로그인에 실패했습니다.");
    }
    saveSession(normalizeSession(data));
    document.getElementById("loginPw").value = "";
    hideLogin();
    loadJobs();
  } catch (err) {
    showLogin(`네트워크 오류: ${err.message}`);
  }
}

function logout() {
  saveSession(null);
  jobsCache = [];
  document.getElementById("main").innerHTML = "";
  document.getElementById("countLabel").textContent = "로그인이 필요합니다";
  showLogin();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && document.getElementById("loginOverlay").classList.contains("show")) {
    login();
  }
});

/* ===================== 데이터 ===================== */

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3500);
}

async function loadAirlineTemplates() {
  // 실패를 삼키지 않습니다. 여기서 터지면 loadJobs()가 화면에 원인을 띄웁니다.
  const res = await sb(`/rest/v1/airline_jobs?select=*&order=id.desc`);
  const rows = await res.json();
  allAirlineRows = rows.slice().sort((a, b) => String(a.name).localeCompare(String(b.name), "ko"));
  airlineTemplates = {};
  // id 내림차순이므로 항공사당 가장 최근 행이 먼저 채워지고 이후 것은 덮어쓰지 않음
  for (const row of rows) {
    if (!airlineTemplates[row.name]) airlineTemplates[row.name] = row;
  }
}

// 봇이 넣는 이름("✈️ KLM항공(드림버스)")과 DB 이름("KLM 네덜란드항공")이 달라서
// 자동 매칭이 자주 실패합니다. 이모지·공백·괄호를 걷어내고 한 번 더 비교합니다.
function normalizeName(s) {
  return String(s || "")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, "")
    .replace(/\(.*?\)/g, "")
    .replace(/\s+/g, "")
    .toLowerCase();
}

// 봇 이름("✈️ 에어아라비아")에서 앞쪽 이모지를 떼어 앱 표시용 이름을 만든다.
// bot_name 에는 이모지가 붙은 원본이 그대로 남아야 맞춤알림 필터가 동작한다.
function cleanAirlineName(s) {
  return String(s || "").replace(/^[^가-힣A-Za-z0-9]+/, "").trim();
}

// 자동 매칭 결과를 돌려줍니다. 확신이 없으면 null → 사용자가 직접 고르게 둡니다.
function findMatch(airline) {
  const exact = allAirlineRows.find(r => r.name === airline);
  if (exact) return exact;
  const target = normalizeName(airline);
  if (!target) return null;
  const hits = allAirlineRows.filter(r => normalizeName(r.name) === target);
  return hits.length === 1 ? hits[0] : null;
}

async function loadJobs() {
  if (!session) return showLogin();

  const main = document.getElementById("main");
  main.innerHTML = `<div class="loading">공고 목록을 불러오는 중...</div>`;
  try {
    await loadAirlineTemplates();
    const res = await sb(`/rest/v1/jobs?review_status=eq.pending&order=id.desc`);
    jobsCache = await res.json();
    renderJobs();
  } catch (err) {
    main.innerHTML = `<div class="empty-state"><div class="big">⚠️</div>불러오기 실패<small>${escapeHtml(err.message)}</small><small>자세한 응답 본문은 개발자 도구 콘솔에 있습니다.</small></div>`;
    document.getElementById("countLabel").textContent = "오류 발생";
  }
}

function renderJobs() {
  const main = document.getElementById("main");
  document.getElementById("countLabel").textContent = `대기 중인 공고 ${jobsCache.length}건`;

  if (jobsCache.length === 0) {
    main.innerHTML = `<div class="empty-state"><div class="big">📭</div>확인할 새 공고가 없어요<small>봇이 새 공고를 찾으면 여기에 나타나요</small></div>`;
    return;
  }
  main.innerHTML = jobsCache.map((job) => cardTemplate(job)).join("");
}

function cardTemplate(job) {
  const created = job.created_at ? new Date(job.created_at).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" }) : "-";
  const template = findMatch(job.airline);
  const reuseNotice = template
    ? `<div class="reuse-notice">♻️ 기존 "${escapeHtml(template.name)}" 정보를 불러왔어요. 필요한 부분만 수정하고 승인하세요.</div>`
    : "";

  const options = allAirlineRows
    .map(r => `<option value="${r.id}"${template && template.id === r.id ? " selected" : ""}>${escapeHtml(r.name)} (id ${r.id})</option>`)
    .join("");

  // 기존 행이 있으면 그 행의 현재 노출 상태를 그대로 유지합니다.
  const showInApp = template ? String(template.status ?? "") === "0" : true;

  // 크루잡스·ANC 처럼 여러 항공사를 모아둔 소스에서 온 공고인지.
  // 이 경우 job.airline 이 실제 항공사가 아니라서, 그대로 bot_name 에 넣으면
  // 맞춤알림 필터가 아무에게도 매칭되지 않습니다.
  const isAggregator = String(job.airline || "").startsWith("🌐");

  return `
  <div class="card" id="card-${job.id}">
    <div class="card-header" onclick="toggleCard(${job.id})">
      <div>
        <div class="card-title">${escapeHtml(job.title || "(제목 없음)")}</div>
        <div class="card-meta">
          <span class="badge">${escapeHtml(job.airline || "-")}</span>
          <span>발견: ${created}</span>
        </div>
      </div>
      <div class="chev" id="chev-${job.id}">▼ 펼치기</div>
    </div>
    <div class="card-body" id="body-${job.id}">
      ${reuseNotice}
      <div class="field">
        <label>반영할 항공사 행</label>
        <select id="target-${job.id}" onchange="onTargetChange(${job.id})">
          <option value="new"${template ? "" : " selected"}>+ 새 항공사로 추가 ("${escapeHtml(job.airline || "")}")</option>
          ${options}
        </select>
        <div class="hint${template ? "" : " warn"}" id="hint-${job.id}">
          ${template
            ? "자동으로 찾은 기존 행에 덮어씁니다."
            : "⚠️ 같은 이름의 기존 행을 못 찾았습니다. 이미 있는 항공사라면 위에서 직접 골라주세요."}
        </div>
      </div>

      <div class="field">
        <label>앱에 표시될 항공사 이름</label>
        <input type="text" id="airlinename-${job.id}"
               value="${escapeAttr(template ? template.name : cleanAirlineName(job.airline))}">
        <div class="hint">봇 이름(${escapeHtml(job.airline || "")})의 이모지는 자동으로 빠집니다.</div>
      </div>

      <div class="field">
        <label>맞춤알림용 이름 (bot_name)</label>
        <input type="text" id="botname-${job.id}"
               value="${escapeAttr(template ? (template.bot_name || job.airline) : job.airline)}">
        <div class="hint${isAggregator ? " warn" : ""}">${isAggregator
          ? "⚠️ 여러 항공사를 모아둔 소스에서 온 공고입니다. 실제 항공사 이름(예: ✈️ 에미레이트항공)으로 직접 고쳐주세요. 이 값이 틀리면 관심 항공사를 골라둔 사용자에게 알림이 가지 않습니다."
          : "앱의 항공사 목록과 이모지·띄어쓰기까지 정확히 같아야 맞춤알림이 동작합니다."}</div>
      </div>

      <div class="field">
        <label>원본 공고 링크</label>
        <a class="link-btn" href="${safeUrl(job.link)}" target="_blank" rel="noopener">🔗 사이트에서 직접 확인하기</a>
      </div>

      <div class="field">
        <label>마감일 (D-day 기준)</label>
        <input type="date" id="enddate-${job.id}" value="${escapeAttr(template?.end_date || '')}">
      </div>

      <div class="field">
        <label>공고 제목 (앱에 표시될 제목)</label>
        <input type="text" id="ddaytitle-${job.id}" value="${escapeAttr(job.title || '')}">
      </div>

      <div class="field">
        <label>지원 링크 (apply_url)</label>
        <input type="text" id="applyurl-${job.id}" value="${escapeAttr(job.link || '')}">
      </div>

      <div class="field">
        <label>공고 설명 (notice_desc)</label>
        <textarea id="noticedesc-${job.id}" placeholder="예: 만 21세 이상 고졸 또는 졸업 이상...">${escapeHtml(template?.notice_desc || '')}</textarea>
      </div>

      <div class="field">
        <label>유의사항 (warning)</label>
        <textarea id="warning-${job.id}" placeholder="예: 오픈데이 지원가능, 온라인 지원 오리엔테이션 수강 등">${escapeHtml(template?.warning || '')}</textarea>
      </div>

      <div class="field">
        <label>자격요건 (qualifications)</label>
        <textarea id="qualifications-${job.id}" placeholder="예: 만 21세 이상, 신장 157cm 이상...">${escapeHtml(template?.qualifications || '')}</textarea>
      </div>

      <div class="field">
        <label>전형절차 (steps)</label>
        <textarea id="steps-${job.id}" placeholder="예: 서류 → 1차 면접 → 2차 면접 → 최종합격">${escapeHtml(template?.steps || '')}</textarea>
      </div>

      <div class="field">
        <label>팁 (tips)</label>
        <textarea id="tips-${job.id}" placeholder="예: 승무원 합격자수 공유 안내 등">${escapeHtml(template?.tips || '')}</textarea>
      </div>

      <div class="field">
        <label>정렬 순서 (sort_order, 숫자가 작을수록 위에 노출)</label>
        <input type="number" id="sortorder-${job.id}" value="${template?.sort_order ?? 999}">
      </div>

      <div class="field">
        <label>앱 노출 여부</label>
        <div class="radio-row">
          <label class="radio-opt">
            <input type="radio" name="status-${job.id}" value="0"${showInApp ? " checked" : ""}>
            앱에 표시
          </label>
          <label class="radio-opt">
            <input type="radio" name="status-${job.id}" value=""${showInApp ? "" : " checked"}>
            저장만 · 앱엔 숨김
          </label>
        </div>
        <div class="hint">한국 채용이 아닌 공고는 "숨김"으로 저장하면 Supabase에서 따로 고칠 필요가 없습니다.</div>
      </div>

      <div class="field">
        <label>알림 보내기</label>
        <div class="radio-row">
          <label class="radio-opt">
            <input type="radio" name="notify-${job.id}" value="yes" checked>
            사용자에게 알림 발송
          </label>
          <label class="radio-opt">
            <input type="radio" name="notify-${job.id}" value="no">
            알림 없이 저장만
          </label>
        </div>
        <div class="hint">알림은 다음 크롤링봇 실행 때 나갑니다. 바로 보내려면 GitHub Actions 에서 Run workflow 를 누르세요.<br>
        기존 항공사 행을 업데이트할 때 이걸 켜지 않으면, 예전에 보낸 기록이 남아 있어 알림이 나가지 않습니다.</div>
      </div>

      <div class="actions">
        <button class="btn btn-reject" onclick="rejectJob(${job.id})">✕ 거절 (오탐/마감)</button>
        <button class="btn btn-approve" onclick="approveJob(${job.id})">✓ 승인하고 앱에 반영</button>
      </div>
    </div>
  </div>`;
}

function toggleCard(id) {
  const body = document.getElementById(`body-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  const isOpen = body.classList.toggle("open");
  chev.textContent = isOpen ? "▲ 접기" : "▼ 펼치기";
}

// 반영 대상을 바꾸면 그 행의 내용으로 입력칸을 다시 채웁니다.
// 공고 제목·지원 링크는 이번에 새로 발견한 공고 것이므로 건드리지 않습니다.
function onTargetChange(jobId) {
  const sel = document.getElementById(`target-${jobId}`);
  const row = sel.value === "new"
    ? null
    : allAirlineRows.find(r => String(r.id) === sel.value);

  const job = jobsCache.find(j => j.id === jobId);
  setVal(`airlinename-${jobId}`,
    row ? row.name : cleanAirlineName(job ? job.airline : ""));
  // 기존 행을 고르면 그 행의 bot_name 을 유지합니다.
  // 새로 만들 때만 봇이 준 이름을 씁니다.
  setVal(`botname-${jobId}`,
    row ? (row.bot_name || "") : (job ? job.airline : ""));
  setVal(`enddate-${jobId}`, row?.end_date || "");
  setVal(`noticedesc-${jobId}`, row?.notice_desc || "");
  setVal(`warning-${jobId}`, row?.warning || "");
  setVal(`qualifications-${jobId}`, row?.qualifications || "");
  setVal(`steps-${jobId}`, row?.steps || "");
  setVal(`tips-${jobId}`, row?.tips || "");
  setVal(`sortorder-${jobId}`, row?.sort_order ?? 999);

  const showInApp = row ? String(row.status ?? "") === "0" : true;
  Array.from(document.getElementsByName(`status-${jobId}`)).forEach(radio => {
    radio.checked = (radio.value === "0") === showInApp;
  });

  const hint = document.getElementById(`hint-${jobId}`);
  if (row) {
    hint.className = "hint";
    hint.textContent = `"${row.name}" (id ${row.id}) 행에 덮어씁니다. 현재 상태: ${showInApp ? "앱에 표시 중" : "숨김"}`;
  } else {
    hint.className = "hint warn";
    hint.textContent = "새 행으로 추가합니다. 이미 있는 항공사면 중복이 생기니 확인하세요.";
  }
}

function setVal(id, value) {
  const el = document.getElementById(id);
  if (el) el.value = value;
}

async function approveJob(id) {
  const job = jobsCache.find(j => j.id === id);
  if (!job) return;

  // 사용자가 고른 반영 대상 ("new" = 새 행, 그 외 = 기존 행 id)
  const targetValue = document.getElementById(`target-${id}`).value;
  const existingTemplate = targetValue === "new"
    ? null
    : allAirlineRows.find(r => String(r.id) === targetValue);

  // 라디오에서 고른 노출 상태. "0" = 앱에 표시, "" = 숨김
  const chosenStatus = (Array.from(document.getElementsByName(`status-${id}`))
    .find(r => r.checked) || {}).value ?? "0";

  // 핵심: 빈칸으로 둔 항목은 payload에 아예 포함하지 않음
  // → PATCH(업데이트) 시 서버가 그 컬럼은 건드리지 않아 기존 값이 그대로 보존됨
  const payload = {
    // 앱 화면에 보이는 이름. 입력칸에서 직접 고칠 수 있고,
    // 비워두면 기존 행 이름이나 이모지를 뗀 봇 이름이 들어갑니다.
    name: val(`airlinename-${id}`)
          || (existingTemplate ? existingTemplate.name : cleanAirlineName(job.airline)),
    // 봇이 쓰는 항공사 이름. 맞춤알림 필터가 이 이름을 기준으로 동작하므로
    // 표시용 이름(name)과 별도로 반드시 저장해야 한다.
    // 예전에는 job.airline 을 그대로 넣었습니다. 그런데 크루잡스·ANC 처럼
    // 여러 항공사를 모아둔 소스에서 온 공고는 그 값이 "🌐 크루잡스" 라서
    // 어떤 사용자의 관심 항공사와도 매칭되지 않았습니다.
    // 이제 입력칸에서 실제 항공사 이름으로 고칠 수 있습니다.
    bot_name: val(`botname-${id}`)
              || (existingTemplate ? existingTemplate.bot_name : job.airline),
    status: chosenStatus,
    // 승인한 시각이 아니라, 크롤링봇이 처음 이 공고를 발견한 시각을 그대로 사용
    created_at: job.created_at || new Date().toISOString()
  };

  const fieldMap = {
    d_day_title: val(`ddaytitle-${id}`),
    apply_url: val(`applyurl-${id}`),
    notice_desc: val(`noticedesc-${id}`),
    warning: val(`warning-${id}`),
    qualifications: val(`qualifications-${id}`),
    steps: val(`steps-${id}`),
    tips: val(`tips-${id}`),
    end_date: val(`enddate-${id}`),
  };
  for (const [key, value] of Object.entries(fieldMap)) {
    if (value) payload[key] = value; // 값이 있을 때만 payload에 추가
  }

  const sortOrderRaw = val(`sortorder-${id}`);
  if (sortOrderRaw) payload.sort_order = parseInt(sortOrderRaw) || 999;

  // 알림 발송 여부.
  //
  // notify_approved.py 는 notified_at 이 비어 있는 공고만 발송하고,
  // 보낸 뒤 시각을 찍어 중복을 막습니다.
  // 기존 행을 업데이트할 때 이 값을 비워주지 않으면 예전 기록이 남아 있어
  // 새 공고인데도 알림이 나가지 않습니다.
  const wantNotify = (Array.from(document.getElementsByName(`notify-${id}`))
    .find(r => r.checked) || {}).value !== "no";
  payload.notified_at = wantNotify ? null : new Date().toISOString();

  setCardBusy(id, true);
  try {
    // 즉시 발송을 하려면 어느 행에 저장됐는지 id 를 알아야 합니다.
    // 그래서 새 행을 만들 때는 return=minimal 대신 저장된 행을 돌려받습니다.
    let targetRowId = null;
    if (existingTemplate) {
      // 이미 이 항공사 정보가 있으면 새로 추가하지 않고, 기존 행을 업데이트
      await sb(`/rest/v1/airline_jobs?id=eq.${existingTemplate.id}`, {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify(payload)
      });
      targetRowId = existingTemplate.id;
    } else {
      // 완전히 새로운 항공사면 새 행으로 추가
      const created = await sb(`/rest/v1/airline_jobs`, {
        method: "POST",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify(payload)
      });
      const rows = await created.json();
      targetRowId = Array.isArray(rows) ? rows[0]?.id : rows?.id;
    }

    await updateReviewStatus(id, "approved");
    const where = existingTemplate ? `"${existingTemplate.name}" 업데이트` : "새 항공사 추가";

    // 즉시 발송.
    //
    // 예전에는 notified_at 만 비워두고 다음 크롤링봇 실행을 기다렸습니다.
    // 스케줄이 하루 8회라 최대 몇 시간이 걸렸습니다.
    //
    // FCM 발송에는 Firebase 서비스 계정 키가 필요한데, 그 키를 이 HTML 에
    // 넣으면 브라우저 소스 보기로 누구나 꺼내 갈 수 있습니다.
    // Edge Function 은 Supabase 서버에서 돌아 키가 밖으로 나가지 않습니다.
    let notifyMsg = " · 알림 없음";
    if (wantNotify) {
      const sent = await sendNotificationNow(targetRowId);
      notifyMsg = sent === null
        ? " · 알림은 다음 봇 실행 때 나갑니다"
        : ` · ${sent}대에 알림 발송`;
    }
    showToast(chosenStatus === "0"
      ? `✓ ${where} 완료 — 앱에 표시됩니다${notifyMsg}`
      : `✓ ${where} 완료 — 저장만 하고 앱엔 숨겼습니다`);
    removeCardFromView(id);
  } catch (err) {
    showToast(`⚠️ 승인 실패: ${err.message}`);
    setCardBusy(id, false);
  }
}

// Edge Function 을 불러 즉시 발송합니다.
//
// 함수가 아직 배포되지 않았거나 실패하면 null 을 돌려줍니다.
// 그 경우에도 notified_at 이 비어 있으므로
// 다음 크롤링봇 실행 때 자동으로 재시도됩니다. 알림을 잃지 않습니다.
async function sendNotificationNow(rowId) {
  if (!rowId) return null;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-job-notification`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${session.access_token}`,
        "apikey": SUPABASE_KEY
      },
      body: JSON.stringify({ job_id: rowId })
    });
    if (!res.ok) {
      console.error("Edge Function 응답:", res.status, await res.text());
      return null;
    }
    const data = await res.json();
    return typeof data.sent === "number" ? data.sent : null;
  } catch (e) {
    console.error("Edge Function 호출 실패:", e);
    return null;
  }
}

async function rejectJob(id) {
  setCardBusy(id, true);
  try {
    await updateReviewStatus(id, "rejected");
    showToast("✕ 거절 처리했어요");
    removeCardFromView(id);
  } catch (err) {
    showToast(`⚠️ 거절 실패: ${err.message}`);
    setCardBusy(id, false);
  }
}

async function updateReviewStatus(id, status) {
  await sb(`/rest/v1/jobs?id=eq.${id}`, {
    method: "PATCH",
    headers: { "Prefer": "return=minimal" },
    body: JSON.stringify({ review_status: status })
  });
}

function removeCardFromView(id) {
  jobsCache = jobsCache.filter(j => j.id !== id);
  const card = document.getElementById(`card-${id}`);
  if (card) card.remove();
  document.getElementById("countLabel").textContent = `대기 중인 공고 ${jobsCache.length}건`;
  if (jobsCache.length === 0) renderJobs();
}

function setCardBusy(id, busy) {
  const card = document.getElementById(`card-${id}`);
  if (!card) return;
  card.querySelectorAll("button").forEach(b => b.disabled = busy);
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(str) {
  return escapeHtml(str);
}
// 크롤링해온 링크를 그대로 href에 넣으면 javascript: 스킴이 섞일 수 있으므로 차단
function safeUrl(str) {
  const s = String(str || "").trim();
  return /^https?:\/\//i.test(s) ? escapeAttr(s) : "#";
}

/* ===================== 시작 ===================== */

(async function init() {
  saveSession(session); // 로그아웃 버튼 표시 상태 동기화
  if (session && await ensureToken()) {
    hideLogin();
    loadJobs();
  } else {
    document.getElementById("main").innerHTML = "";
    document.getElementById("countLabel").textContent = "로그인이 필요합니다";
    showLogin();
  }
})();
</script>
</body>
</html>
